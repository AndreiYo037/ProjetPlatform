[project]
name = "projet"
version = "0.1.0"
description = "Projet — proof-of-work hiring infrastructure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.11",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "httpx>=0.27",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
projet-seed = "projet.seeds.cli:main"
projet-verify-sources = "projet.seeds.verify:main"
projet-worker = "projet.outbox.worker:main"
projet-scheduler = "projet.jobs.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends() in an argument default is the FastAPI idiom, not a mutable default.
"projet/main.py" = ["B008"]
# Test names describe the behaviour they hold; wrapping them hurts more than it helps.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:projet.*"]

[tool.mypy]
python_version = "3.11"
packages = ["projet"]
ignore_missing_imports = true
