name: Create Christmas Together draft

# Manual trigger. Creates the challenge as a DRAFT; never publishes.
on:
  workflow_dispatch: {}

jobs:
  create:
    name: Create draft challenge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python .github/scripts/create_christmas_together_draft.py
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
