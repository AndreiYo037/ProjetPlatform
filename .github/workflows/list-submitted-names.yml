name: List submitted names since event start

# Read-only diagnostic, manual trigger.
on:
  workflow_dispatch: {}

jobs:
  check:
    name: List names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python .github/scripts/list_submitted_names.py
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
