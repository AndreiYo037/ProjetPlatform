name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check projet tests
          ruff format --check projet tests
      - name: Type check
        run: |
          . .venv/bin/activate
          mypy
      - name: Content validation
        # Catches a role renamed in one document but not the others, and any
        # slug drift that would orphan live programmes and scores.
        run: |
          . .venv/bin/activate
          python -m projet.seeds.cli --check
      - name: Tests
        run: |
          . .venv/bin/activate
          python -m pytest -q
      - name: Offline Postgres DDL
        # Proves the migration renders valid Postgres without a server.
        run: |
          . .venv/bin/activate
          PROJET_DATABASE_URL="postgresql+psycopg://u:p@localhost/projet" alembic upgrade head --sql > /dev/null

  postgres:
    name: API (Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: projet
          POSTGRES_USER: projet
          POSTGRES_DB: projet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJET_DATABASE_URL: postgresql+psycopg://projet:projet@localhost:5432/projet
      PROJET_TEST_DATABASE_URL: postgresql+psycopg://projet:projet@localhost:5432/projet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Migrate
        run: |
          . .venv/bin/activate
          alembic upgrade head
      - name: Seed the taxonomy
        run: |
          . .venv/bin/activate
          python -m projet.seeds.cli
      - name: Tests against the production dialect
        # The only real Postgres verification available: JSONB, native UUID,
        # timestamptz and the expression index all behave differently to SQLite.
        run: |
          . .venv/bin/activate
          python -m pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate API types from the committed schema
        run: pnpm gen:api
      - run: pnpm typecheck
      - run: pnpm build
