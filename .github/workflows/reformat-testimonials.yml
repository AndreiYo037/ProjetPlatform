name: Reformat testimonials

# Manual trigger. Dry run unless apply is "yes".
on:
  workflow_dispatch:
    inputs:
      company_password:
        description: "Password for the company accounts"
        required: true
      apply:
        description: "yes to write and sign; anything else is a dry run"
        required: false
        default: "no"
      only:
        description: "Only participants whose name contains this text"
        required: false
        default: "Thriti"
      company:
        description: "Which company's account (part of its email), e.g. bluenexus or beez"
        required: false
        default: "bluenexus"
      extra_names:
        description: "Comma-separated names to add to the Re: line"
        required: false
        default: ""
      include_signed:
        description: "yes to redo letters that are already signed"
        required: false
        default: "no"
      signer_name:
        description: "Name the letter is signed with (blank = the account's own name)"
        required: false
        default: ""
      signer_title:
        description: "Signer's title (optional)"
        required: false
        default: ""

jobs:
  reformat:
    name: Reformat testimonials
    runs-on: ubuntu-latest
    steps:
      - name: Mask password
        run: echo "::add-mask::${{ inputs.company_password }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python reformat_testimonials.py
        working-directory: .github/scripts
        env:
          COMPANY_PASSWORD: ${{ inputs.company_password }}
          APPLY: ${{ inputs.apply == 'yes' && '1' || '0' }}
          ONLY: ${{ inputs.only }}
          COMPANY_MATCH: ${{ inputs.company }}
          EXTRA_NAMES: ${{ inputs.extra_names }}
          INCLUDE_SIGNED: ${{ inputs.include_signed == 'yes' && '1' || '0' }}
          SIGNER_NAME: ${{ inputs.signer_name }}
          SIGNER_TITLE: ${{ inputs.signer_title }}
