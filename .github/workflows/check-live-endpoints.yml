name: Check live endpoints

# Manual, read-only. Reports whether production serves the memo and pitch-mode API.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python .github/scripts/check_live_endpoints.py
