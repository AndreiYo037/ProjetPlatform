name: Fix letter names

# Manual trigger. Dry run unless apply is "yes".
on:
  workflow_dispatch:
    inputs:
      company_password:
        description: "Password for the company accounts"
        required: true
      apply:
        description: "yes to write and sign; anything else is a dry run"
        required: false
        default: "no"

jobs:
  fix:
    name: Fix letter names
    runs-on: ubuntu-latest
    steps:
      - name: Mask password
        run: echo "::add-mask::${{ inputs.company_password }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python fix_letter_names.py
        working-directory: .github/scripts
        env:
          COMPANY_PASSWORD: ${{ inputs.company_password }}
          APPLY: ${{ inputs.apply == 'yes' && '1' || '0' }}
