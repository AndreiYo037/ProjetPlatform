name: Issue certificates

# Manual trigger. Plans only unless apply is "yes".
on:
  workflow_dispatch:
    inputs:
      company_password:
        description: "Password for the company accounts"
        required: true
      apply:
        description: "yes to issue; anything else only plans"
        required: false
        default: "no"

jobs:
  notify:
    name: Issue certificates
    runs-on: ubuntu-latest
    steps:
      - name: Mask password
        run: echo "::add-mask::${{ inputs.company_password }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python issue_certificates.py
        working-directory: .github/scripts
        env:
          COMPANY_PASSWORD: ${{ inputs.company_password }}
          APPLY: ${{ inputs.apply == 'yes' && '1' || '0' }}
