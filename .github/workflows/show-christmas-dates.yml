name: Show Christmas Together dates

# Read-only report, manual trigger.
on:
  workflow_dispatch:

jobs:
  list:
    name: Show dates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python .github/scripts/show_christmas_dates.py
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
