name: Reset Hyphn password

# One-off account fix, manual trigger. The new password is a run input, not
# committed to the repo or a stored secret — this script is specific to one
# account and isn't meant to be reused.
on:
  workflow_dispatch:
    inputs:
      new_password:
        description: "New password for Hyphn's account"
        required: true

jobs:
  reset:
    name: Reset password
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - run: python .github/scripts/reset_hyphn_password.py
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          NEW_PASSWORD: ${{ inputs.new_password }}
